{% extends "base.html" %}
{% block title %}Change password | HouseholdChores{% endblock %}
{% block content %}
<div class="narrow">
    <section class="card">
        <h2>Change password</h2>
        <p class="muted">Enter your current password, then choose a new one.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change password</button>
        </form>
        <div class="actions">
            <a class="btn-link secondary" href="{% url 'profile' %}">Back to profile</a>
        </div>
    </section>
</div>
{% endblock %}
